# cargo-fuzz project for the RGQL parser (AC-QL-002) and the security-relevant parsers of the
# server (TC-SEC-010, NFR-SEC-004). Needs a nightly toolchain:
#   cargo +nightly fuzz run <target>
# It is its own workspace (empty `[workspace]` below), so `cargo build --workspace` and
# `cargo deny check` of the main workspace on stable never see it. See fuzz/README.md.

[package]
name = "rustegon-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustegon-common = { path = "../crates/rustegon-common" }
rustegon-query = { path = "../crates/rustegon-query" }
# Security parser oracles (TC-SEC-010): `fuzzing` exposes `rustegon_server::fuzzing`.
rustegon-server = { path = "../crates/rustegon-server", features = ["fuzzing"] }

[workspace]
members = ["."]

[profile.release]
# Fuzzing builds keep debug assertions and overflow checks: an arithmetic overflow is a bug.
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "parse_statement"
path = "fuzz_targets/parse_statement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_script"
path = "fuzz_targets/parse_script.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ast_json"
path = "fuzz_targets/ast_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scram_server"
path = "fuzz_targets/scram_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_headers"
path = "fuzz_targets/request_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rest_body"
path = "fuzz_targets/rest_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "continuation_token"
path = "fuzz_targets/continuation_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authorization"
path = "fuzz_targets/authorization.rs"
