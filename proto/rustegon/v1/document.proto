syntax = "proto3";

package rustegon.v1;

import "rustegon/v1/common.proto";
import "rustegon/v1/error.proto";
import "rustegon/v1/query_ast.proto";

// Key-based document operations (protocol.md §2, data-model.md). Documents are addressed by
// `_id` (an RDoc Value). `if_rev` is the optimistic-concurrency precondition (REST `If-Match`):
// a mismatch fails with RGN-2009 PreconditionFailed. `txn_id` (or `rgn-txn-id` metadata) runs
// the operation inside a transaction. The `Counters` RPC of protocol.md §2 is not part of this
// version yet: the engine has no document-counter API (PD-045); it will be added additively.
service DocumentService {
  // Reads one document by id.
  rpc Get(GetRequest) returns (GetResponse);
  // Reads several documents by id.
  rpc GetMany(GetManyRequest) returns (GetManyResponse);
  // Inserts documents (RGN-1005 DuplicateKey if an id exists).
  rpc Insert(InsertRequest) returns (InsertResponse);
  // Replaces a whole document by id.
  rpc Replace(ReplaceRequest) returns (ReplaceResponse);
  // Applies update operators to a document by id (atomic, data-model.md §2.3).
  rpc Update(UpdateRequest) returns (UpdateResponse);
  // Inserts the document or replaces the one with the same `_id`.
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  // Deletes a document by id.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Mixed batch of writes on one collection (≤ 100 000 ops, ≤ 48 MiB; protocol.md §5.4).
  rpc BulkWrite(BulkWriteRequest) returns (BulkWriteResponse);
}

// Which version of the document a write returns.
enum ReturnDocument {
  // Not set: return no document.
  RETURN_DOCUMENT_UNSPECIFIED = 0;
  // The document before the write.
  RETURN_DOCUMENT_BEFORE = 1;
  // The document after the write.
  RETURN_DOCUMENT_AFTER = 2;
}

// Options shared by write RPCs.
message WriteOptions {
  // Write concern (outside transactions; a transaction uses its commit concern).
  WriteConcern write_concern = 1;
}

// Outcome of one written document.
message WriteResult {
  // Document id.
  Value id = 1;
  // New `_rev` of the document (absent for deletes).
  optional string rev = 2;
}

// Request of DocumentService.Get.
message GetRequest {
  // Database.
  string database = 1;
  // Collection.
  string collection = 2;
  // Document id.
  Value id = 3;
  // Transaction.
  optional string txn_id = 4;
  // Read consistency outside transactions.
  ReadConsistency consistency = 5;
}

// Response of DocumentService.Get.
message GetResponse {
  // The document; absent when no document has this id (not an error).
  optional Document document = 1;
}

// Request of DocumentService.GetMany.
message GetManyRequest {
  // Database.
  string database = 1;
  // Collection.
  string collection = 2;
  // Document ids.
  repeated Value ids = 3;
  // Transaction.
  optional string txn_id = 4;
  // Read consistency outside transactions.
  ReadConsistency consistency = 5;
}

// Response of DocumentService.GetMany.
message GetManyResponse {
  // Found documents, in request order; ids without a document are omitted.
  repeated Document documents = 1;
}

// Request of DocumentService.Insert.
message InsertRequest {
  // Database.
  string database = 1;
  // Collection.
  string collection = 2;
  // Documents; a missing `_id` is generated by the server.
  repeated Document documents = 3;
  // Transaction.
  optional string txn_id = 4;
  // Options.
  WriteOptions options = 5;
}

// Response of DocumentService.Insert.
message InsertResponse {
  // One result per inserted document, in request order.
  repeated WriteResult results = 1;
  // Warnings (e.g. validator in `warn` mode).
  repeated Warning warnings = 2;
}

// Request of DocumentService.Replace.
message ReplaceRequest {
  // Database.
  string database = 1;
  // Collection.
  string collection = 2;
  // Document id.
  Value id = 3;
  // New document (its `_id`, if present, must equal `id`).
  Document document = 4;
  // Expected current `_rev`.
  optional string if_rev = 5;
  // Transaction.
  optional string txn_id = 6;
  // Options.
  WriteOptions options = 7;
  // Document to return.
  ReturnDocument return_document = 8;
}

// Response of DocumentService.Replace.
message ReplaceResponse {
  // Whether a document with the id existed (nothing is written otherwise).
  bool matched = 1;
  // Write result when matched.
  WriteResult result = 2;
  // Returned document, if requested and matched.
  optional Document document = 3;
  // Warnings.
  repeated Warning warnings = 4;
}

// Request of DocumentService.Update.
message UpdateRequest {
  // Database.
  string database = 1;
  // Collection.
  string collection = 2;
  // Document id.
  Value id = 3;
  // Update operators, applied all-or-nothing in order (structured RGQL update operations).
  repeated AstUpdateOp operations = 4;
  // Expected current `_rev`.
  optional string if_rev = 5;
  // Transaction.
  optional string txn_id = 6;
  // Options.
  WriteOptions options = 7;
  // Document to return.
  ReturnDocument return_document = 8;
  // Parameters referenced by the operators.
  map<string, Value> params = 9;
}

// Response of DocumentService.Update.
message UpdateResponse {
  // Whether a document with the id existed.
  bool matched = 1;
  // Whether the document changed.
  bool modified = 2;
  // Write result when matched.
  WriteResult result = 3;
  // Returned document, if requested and matched.
  optional Document document = 4;
  // Warnings.
  repeated Warning warnings = 5;
}

// Request of DocumentService.Upsert.
message UpsertRequest {
  // Database.
  string database = 1;
  // Collection.
  string collection = 2;
  // Document; its `_id` selects the document to replace (generated if missing).
  Document document = 3;
  // Expected current `_rev` (only meaningful when the document exists).
  optional string if_rev = 4;
  // Transaction.
  optional string txn_id = 5;
  // Options.
  WriteOptions options = 6;
  // Document to return.
  ReturnDocument return_document = 7;
}

// Response of DocumentService.Upsert.
message UpsertResponse {
  // True if the document was inserted, false if it replaced an existing one.
  bool inserted = 1;
  // Write result.
  WriteResult result = 2;
  // Returned document, if requested.
  optional Document document = 3;
  // Warnings.
  repeated Warning warnings = 4;
}

// Request of DocumentService.Delete.
message DeleteRequest {
  // Database.
  string database = 1;
  // Collection.
  string collection = 2;
  // Document id.
  Value id = 3;
  // Expected current `_rev`.
  optional string if_rev = 4;
  // Transaction.
  optional string txn_id = 5;
  // Options.
  WriteOptions options = 6;
  // Return the deleted document.
  bool return_document = 7;
}

// Response of DocumentService.Delete.
message DeleteResponse {
  // Whether a document was deleted.
  bool deleted = 1;
  // The deleted document, if requested.
  optional Document document = 2;
}

// One operation of a bulk write.
message BulkOperation {
  // Operation.
  oneof op {
    // Insert.
    BulkInsert insert = 1;
    // Replace by id.
    BulkReplace replace = 2;
    // Update by id.
    BulkUpdate update = 3;
    // Upsert.
    BulkUpsert upsert = 4;
    // Delete by id.
    BulkDelete delete = 5;
  }
}

// Bulk insert.
message BulkInsert {
  // Document.
  Document document = 1;
}

// Bulk replace.
message BulkReplace {
  // Document id.
  Value id = 1;
  // New document.
  Document document = 2;
  // Expected current `_rev`.
  optional string if_rev = 3;
}

// Bulk update.
message BulkUpdate {
  // Document id.
  Value id = 1;
  // Update operators.
  repeated AstUpdateOp operations = 2;
  // Expected current `_rev`.
  optional string if_rev = 3;
}

// Bulk upsert.
message BulkUpsert {
  // Document.
  Document document = 1;
}

// Bulk delete.
message BulkDelete {
  // Document id.
  Value id = 1;
  // Expected current `_rev`.
  optional string if_rev = 2;
}

// Request of DocumentService.BulkWrite.
message BulkWriteRequest {
  // Database.
  string database = 1;
  // Collection.
  string collection = 2;
  // Operations.
  repeated BulkOperation operations = 3;
  // Stop at the first failed operation (true) or attempt all (false). Inside a transaction a
  // failure always fails the call.
  bool ordered = 4;
  // Transaction.
  optional string txn_id = 5;
  // Options.
  WriteOptions options = 6;
  // Parameters referenced by update operators.
  map<string, Value> params = 7;
}

// Failure of one bulk operation.
message BulkWriteError {
  // Index of the operation in the request.
  uint32 index = 1;
  // Error (same shape as in google.rpc.Status.details).
  ErrorDetail error = 2;
  // Human-readable message.
  string message = 3;
}

// Response of DocumentService.BulkWrite.
message BulkWriteResponse {
  // Documents inserted (inserts and inserting upserts).
  uint64 inserted = 1;
  // Documents matched by replace/update/upsert.
  uint64 matched = 2;
  // Documents changed by replace/update/upsert.
  uint64 modified = 3;
  // Documents deleted.
  uint64 deleted = 4;
  // Failed operations.
  repeated BulkWriteError errors = 5;
  // Warnings.
  repeated Warning warnings = 6;
}
