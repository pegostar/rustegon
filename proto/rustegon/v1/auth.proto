syntax = "proto3";

package rustegon.v1;

import "rustegon/v1/common.proto";

// Authentication and sessions (protocol.md §2, §8; security.md §2).
//
// SCRAM-SHA-256 flow on one Authenticate stream (PD-045):
//   client -> AuthenticateRequest{mechanism=SCRAM_SHA_256, payload=client-first, client_info}
//   server -> AuthenticateResponse{challenge=server-first}
//   client -> AuthenticateRequest{payload=client-final}
//   server -> AuthenticateResponse{success{server_final, session_token, ...}}; stream ends.
// X.509: the TLS client certificate authenticates; the client sends one request with
// mechanism=X509 and an empty payload and receives `success` directly. API keys need no
// handshake (`authorization: ApiKey rgn_...`). Any failure ends the stream with a gRPC error
// carrying ErrorDetail (RGN-4001 Unauthenticated, RGN-4007 AccountLocked, RGN-4003 RateLimited).
service AuthService {
  // SASL-style handshake; yields a session token used as `authorization: Bearer <token>`.
  rpc Authenticate(stream AuthenticateRequest) returns (stream AuthenticateResponse);
  // Revokes the session of the calling `authorization` token.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Identity and roles of the calling session.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
}

// Authentication mechanism.
enum AuthMechanism {
  // Not set (rejected on the first request).
  AUTH_MECHANISM_UNSPECIFIED = 0;
  // SCRAM-SHA-256 (RFC 5802/7677), optionally with `tls-exporter` channel binding (RFC 9266).
  AUTH_MECHANISM_SCRAM_SHA_256 = 1;
  // TLS client certificate mapped to a user (`x509:CN=...`).
  AUTH_MECHANISM_X509 = 2;
  // API key (reported by WhoAmI only; API keys are not used with Authenticate).
  AUTH_MECHANISM_API_KEY = 3;
}

// Client identification stored with the session (`client_info`, security.md §2.1).
message ClientInfo {
  // Driver or tool name, e.g. "rustegon-dotnet".
  string driver_name = 1;
  // Driver version (semver).
  string driver_version = 2;
  // Free-form application name.
  string application = 3;
}

// One client step of Authenticate.
message AuthenticateRequest {
  // Mechanism; required on the first request, ignored afterwards.
  AuthMechanism mechanism = 1;
  // SASL message of this step (client-first, then client-final); empty for X509.
  bytes payload = 2;
  // Client identification; first request only.
  ClientInfo client_info = 3;
}

// One server step of Authenticate.
message AuthenticateResponse {
  // Step result.
  oneof step {
    // Server challenge (SCRAM server-first); the client answers with the next request.
    bytes challenge = 1;
    // Authentication completed; the stream ends after this message.
    AuthSuccess success = 2;
  }
}

// Successful authentication.
message AuthSuccess {
  // SCRAM server-final message (`v=<verifier>`); the client must verify it. Empty for X509.
  bytes server_final = 1;
  // Session token (256-bit random, base64url). Secret: never log it.
  string session_token = 2;
  // Absolute expiry of the session.
  int64 expires_at_unix_ms = 3;
  // Authenticated user name.
  string user = 4;
  // The user must change the password before other operations are allowed.
  bool must_change_password = 5;
}

// Request of AuthService.Logout.
message LogoutRequest {}

// Response of AuthService.Logout.
message LogoutResponse {}

// Request of AuthService.WhoAmI.
message WhoAmIRequest {}

// Response of AuthService.WhoAmI.
message WhoAmIResponse {
  // User name.
  string user = 1;
  // Effective role grants (direct, or the API key scope).
  repeated RoleGrant roles = 2;
  // How the session was authenticated.
  AuthMechanism mechanism = 3;
  // Session expiry (0 for API keys without expiry).
  int64 expires_at_unix_ms = 4;
  // Key id when authenticated by API key.
  optional string api_key_id = 5;
}
