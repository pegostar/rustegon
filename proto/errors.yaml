# Rustegon error code catalog (source of truth: docs/specifications/protocol.md §7).
# Generates rustegon_common::ErrorCode (build script) and, later, the C#/Java driver enums.
# APPEND-ONLY: codes, names and meanings never change or disappear (protocol.md §7, §9).
#
# Fields: code, name, aliases (optional), internal (optional, never returned to clients),
# grpc (google.rpc.Code name), http (status), retryable ("no" | "yes" | "conditional"),
# retry_note (optional qualifier, e.g. "other node").
version: 1
