description: "Inserts (DocumentService.Insert): ids, generated ids, atomic batches, value round trips, rejected names."
tests:
  - id: TC-DRV-CONF-CRUD-001
    description: "insertOne with an explicit _id returns it and stores the document."
    covers: [Collection.InsertOne, Database.GetCollection]
    setup: {collections: [{name: items}]}
    operations:
      - object: collection
        name: insertOne
        args: {document: {"_id": 1, "name": "pen", "qty": 10}}
        expect: {result: {insertedId: 1}}
    outcome:
      items: [{"_id": 1, "name": "pen", "qty": 10}]

  - id: TC-DRV-CONF-CRUD-002
    description: "insertOne without _id: the server generates an objectId and places it first."
    covers: [Collection.InsertOne]
    setup: {collections: [{name: items}]}
    operations:
      - object: collection
        name: insertOne
        args: {document: {"name": "pen"}}
        saveAs: inserted
        expect: {result: {insertedId: {"$$type": "objectId"}}}
      - object: collection
        name: findById
        args: {id: "$$ref:inserted.insertedId"}
        expect: {result: {"_id": "$$ref:inserted.insertedId", "name": "pen"}}

  - id: TC-DRV-CONF-CRUD-003
    description: "insertMany returns the ids in input order."
    covers: [Collection.InsertMany]
    setup: {collections: [{name: items}]}
    operations:
      - object: collection
        name: insertMany
        args:
          documents:
            - {"_id": 3, "n": "c"}
            - {"_id": 1, "n": "a"}
            - {"_id": "two", "n": "b"}
        expect: {result: {insertedIds: [3, 1, "two"]}}
    outcome:
      items:
        - {"_id": 1, "n": "a"}
        - {"_id": 3, "n": "c"}
        - {"_id": "two", "n": "b"}

  - id: TC-DRV-CONF-CRUD-004
    description: "insertOne of an existing _id fails with DuplicateKey and changes nothing."
    covers: [Collection.InsertOne, Behavior.ErrorMapping]
    setup:
      collections: [{name: items}]
      data: {items: [{"_id": 1, "v": "old"}]}
    operations:
      - object: collection
        name: insertOne
        args: {document: {"_id": 1, "v": "new"}}
        expect: {error: {code: 1005, name: "DuplicateKey", exception: DuplicateKey, retryable: false}}
    outcome:
      items: [{"_id": 1, "v": "old"}]

  - id: TC-DRV-CONF-CRUD-005
    description: "insertMany is atomic: one duplicate id rejects the whole batch."
    covers: [Collection.InsertMany, Behavior.ErrorMapping]
    setup:
      collections: [{name: items}]
      data: {items: [{"_id": 2}]}
    operations:
      - object: collection
        name: insertMany
        args: {documents: [{"_id": 1}, {"_id": 2}, {"_id": 3}]}
        expect: {error: {code: 1005, exception: DuplicateKey}}
    outcome:
      items: [{"_id": 2}]

  - id: TC-DRV-CONF-CRUD-006
    description: "Every value type survives insert + findById unchanged (types, edge values, nesting)."
    covers: [Collection.InsertOne, Collection.FindById, Codec.EncodeDocument, Codec.DecodeDocument]
    setup: {collections: [{name: items}]}
    operations:
      - object: collection
        name: insertOne
        args:
          document:
            "_id": {"$oid": "65a1b2c3d4e5f60718293a4b"}
            "null": null
            "t": true
            "i": -42
            "big": {"$int64": "9223372036854775807"}
            "small": {"$int64": "-9223372036854775808"}
            "x": 1.5
            "one": 1.0
            "negz": -0.0
            "nan": {"$float": "NaN"}
            "inf": {"$float": "-Infinity"}
            "dec": {"$decimal": "12.50"}
            "s": "héllo 日本語 😀"
            "nul": "a\u0000b"
            "bin": {"$binary": {"base64": "AQID", "subType": "00"}}
            "ubin": {"$binary": {"base64": "ASNFZ4mrze8BI0VniavN7w==", "subType": "04"}}
            "dt": {"$date": "2026-01-01T00:00:00.000Z"}
            "old": {"$date": "1969-12-31T23:59:59.999Z"}
            "u": {"$uuid": "01234567-89ab-cdef-0123-456789abcdef"}
            "vec": {"$vector": [0.5, -1.0, 3.25]}
            "arr": [1, "two", 3.0, [], {}]
            "obj": {"k": {"deep": [{"x": null}]}}
        expect: {result: {insertedId: {"$oid": "65a1b2c3d4e5f60718293a4b"}}}
      - object: collection
        name: findById
        args: {id: {"$oid": "65a1b2c3d4e5f60718293a4b"}}
        expect:
          result:
            "_id": {"$oid": "65a1b2c3d4e5f60718293a4b"}
            "null": null
            "t": true
            "i": -42
            "big": {"$int64": "9223372036854775807"}
            "small": {"$int64": "-9223372036854775808"}
            "x": 1.5
            "one": 1.0
            "negz": -0.0
            "nan": {"$float": "NaN"}
            "inf": {"$float": "-Infinity"}
            "dec": {"$decimal": "12.50"}
            "s": "héllo 日本語 😀"
            "nul": "a\u0000b"
            "bin": {"$binary": {"base64": "AQID", "subType": "00"}}
            "ubin": {"$binary": {"base64": "ASNFZ4mrze8BI0VniavN7w==", "subType": "04"}}
            "dt": {"$date": "2026-01-01T00:00:00.000Z"}
            "old": {"$date": "1969-12-31T23:59:59.999Z"}
            "u": {"$uuid": "01234567-89ab-cdef-0123-456789abcdef"}
            "vec": {"$vector": [0.5, -1.0, 3.25]}
            "arr": [1, "two", 3.0, [], {}]
            "obj": {"k": {"deep": [{"x": null}]}}

  - id: TC-DRV-CONF-CRUD-007
    description: "Field order is part of the document and is preserved."
    covers: [Collection.InsertOne, Collection.FindById]
    setup: {collections: [{name: items}]}
    operations:
      - object: collection
        name: insertOne
        args: {document: {"_id": 1, "zeta": 1, "alpha": 2, "mid": {"z": 1, "a": 2}}}
      - object: collection
        name: findById
        args: {id: 1}
        fieldOrder: true
        expect: {result: {"_id": 1, "zeta": 1, "alpha": 2, "mid": {"z": 1, "a": 2}}}

  - id: TC-DRV-CONF-CRUD-008
    description: "A $-prefixed field name is rejected with InvalidFieldName (by the driver codec or the server)."
    covers: [Collection.InsertOne, Codec.EncodeDocument]
    setup: {collections: [{name: items}]}
    operations:
      - object: collection
        name: insertOne
        args: {document: {"_id": 1, "nested": {"$set": 1}}}
        expect: {error: {code: 1004, exception: Client, retryable: false}}
    outcome:
      items: []

  - id: TC-DRV-CONF-CRUD-009
    description: "Inserting into a collection that does not exist creates it (FR-SCH-001: implicitCollectionCreation defaults to true)."
    covers: [Collection.InsertOne]
    setup: {collections: [{name: items}]}
    operations:
      - object: collection
        collection: new_collection
        name: insertOne
        args: {document: {"_id": 1}}
        expect: {result: {insertedId: 1}}
    outcome:
      new_collection: [{"_id": 1}]

  - id: TC-DRV-CONF-CRUD-010
    description: "A user document may not set the server-maintained _rev field."
    covers: [Collection.InsertOne]
    setup: {collections: [{name: items}]}
    operations:
      - object: collection
        name: insertOne
        args: {document: {"_id": 1, "_rev": "forged"}}
        expect: {error: {code: 1004, exception: Client}}
