# Driver Conceptual Model (dotnet-driver.md §1, §3-§10; java-driver.md §2-§7) as a list of
# operations with stable ids, shared by the .NET and Java drivers (FR-DRV-003, AC-DRV-003).
#
# status:
#   r1                  part of the R1 drivers (served by the M4 server); AC-DRV-003 coverage
#                       counts these: every r1 operation is covered by at least one test
#                       (checked by crates/rustegon-common/tests/driver_conformance.rs).
#   deferred(<ms>)      not exposed in R1 (PD-069); added back additively with milestone <ms>,
#                       gated on a GetServerInfo.features flag (`feature`). `M11-R2` = later M11
#                       work that has no server dependency (Java async API, extra packages).
# kind:
#   operation           an I/O call on a handle (client, database, collection, cursor, ...)
#   builder             a pure builder (filters, updates, sorts, projections, bulk models)
#   codec               RDoc / extended-JSON codec entry points (checked by the codec vectors)
#   behavior            a cross-cutting rule (connection strings, retries, error mapping, ...)
# dotnet / java:        the public member each driver exposes (language naming conventions,
#                       java-driver.md §11). .NET I/O methods take a CancellationToken last.
# rpc:                  the gRPC methods behind the operation (protocol.md §2).
# Arguments and results of `operation` entries are named as the conformance tests use them
# (README.md, "Operations"); drivers map them onto their own parameter/property names.
version: 1
operations:
  # ------------------------------------------------------------------ client and settings
  - id: Client.Create
    kind: operation
    status: r1
    dotnet: "new RustegonClient(RustegonClientSettings)"
    java: "RustegonClient.create(RustegonClientSettings)"
    rpc: [SessionService.GetServerInfo, AuthService.Authenticate]
  - id: Client.CreateFromConnectionString
    kind: operation
    status: r1
    dotnet: "new RustegonClient(string connectionString)"
    java: "RustegonClient.create(String connectionString)"
    rpc: [SessionService.GetServerInfo, AuthService.Authenticate]
  - id: Settings.FromConnectionString
    kind: behavior
    status: r1
    dotnet: "RustegonClientSettings.FromConnectionString(string)"
    java: "RustegonClientSettings.fromConnectionString(String)"
    notes: "Grammar and expected settings: connstring.yaml (DEC-014)."
  - id: Client.GetServerInfo
    kind: operation
    status: r1
    dotnet: "RustegonClient.GetServerInfoAsync()"
    java: "RustegonClient.serverInfo()"
    rpc: [SessionService.GetServerInfo]
    result: "{serverVersion, protocolVersion, features: [string]}"
  - id: Client.GetDatabase
    kind: operation
    status: r1
    dotnet: "RustegonClient.GetDatabase(string)"
    java: "RustegonClient.database(String)"
    notes: "No I/O; the default database of the settings when the name is omitted."
  - id: Client.ListDatabaseNames
    kind: operation
    status: r1
    dotnet: "RustegonClient.ListDatabaseNamesAsync()"
    java: "RustegonClient.listDatabaseNames()"
    rpc: [SchemaService.ListDatabases]
    result: "[string] sorted by name"
  - id: Client.CreateDatabase
    kind: operation
    status: r1
    dotnet: "RustegonClient.CreateDatabaseAsync(string, CreateDatabaseOptions?)"
    java: "RustegonClient.createDatabase(String, CreateDatabaseOptions)"
    rpc: [SchemaService.CreateDatabase]
    result: "{created: bool}"
  - id: Client.DropDatabase
    kind: operation
    status: r1
    dotnet: "RustegonClient.DropDatabaseAsync(string, DropOptions?)"
    java: "RustegonClient.dropDatabase(String, DropOptions)"
    rpc: [SchemaService.DropDatabase]
    result: "{dropped: bool}"
  - id: Client.StartSession
    kind: operation
    status: r1
    dotnet: "RustegonClient.StartSessionAsync(SessionOptions?)"
    java: "RustegonClient.startSession(SessionOptions)"
    notes: "R1: pass-through of rgn-causality-token (PD-069); no server call."
  - id: Client.BeginTransaction
    kind: operation
    status: r1
    dotnet: "RustegonClient.BeginTransactionAsync(TransactionOptions?)"
    java: "RustegonClient.beginTransaction(TransactionOptions)"
    rpc: [TransactionService.Begin]
  - id: Client.WithTransaction
    kind: operation
    status: r1
    dotnet: "RustegonClient.WithTransactionAsync(Func<ITransaction, CancellationToken, Task<T>>, TransactionOptions?)"
    java: "RustegonClient.withTransaction(TransactionOptions, TransactionCallback<T>)"
    rpc: [TransactionService.Begin, TransactionService.Commit, TransactionService.Rollback, TransactionService.Status]
    notes: "transactions.md §5 (normative retry loop)."
  - id: Client.ChangePassword
    kind: operation
    status: r1
    dotnet: "RustegonClient.ChangePasswordAsync(string currentPassword, string newPassword)"
    java: "RustegonClient.changePassword(char[] currentPassword, char[] newPassword)"
    rpc: [AdminService.ChangePassword]
    notes: "PD-076."
  - id: Client.Close
    kind: operation
    status: r1
    dotnet: "RustegonClient.DisposeAsync()"
    java: "RustegonClient.close()"
    rpc: [AuthService.Logout]
  - id: Client.Async
    kind: operation
    status: deferred(M11-R2)
    dotnet: "(n/a: the .NET API is asynchronous only)"
    java: "RustegonClient.async()"
    notes: "Java CompletableFuture / Flow.Publisher API (java-driver.md §3); DIVERGENCES.md."
  # ------------------------------------------------------------------ credentials
  - id: Credential.Scram
    kind: behavior
    status: r1
    dotnet: "RustegonCredential.Scram(string user, string password)"
    java: "RustegonCredential.scram(String user, char[] password)"
    rpc: [AuthService.Authenticate]
    notes: "SCRAM-SHA-256 without channel binding, gs2 header `n,,` (PD-074)."
  - id: Credential.ApiKey
    kind: behavior
    status: r1
    dotnet: "RustegonCredential.ApiKey(string)"
    java: "RustegonCredential.apiKey(String)"
    notes: "`authorization: ApiKey rgn_…` on every call, no handshake."
  - id: Credential.X509
