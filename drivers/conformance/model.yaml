    result: "cursor of rows (documents, or {value: x} rows of SELECT VALUE)"
  - id: Database.CreateCollection
    kind: operation
    status: r1
    dotnet: "IRustegonDatabase.CreateCollectionAsync(string, CreateCollectionOptions?)"
    java: "RustegonDatabase.createCollection(String, CreateCollectionOptions)"
    rpc: [SchemaService.CreateCollection]
    result: "{created: bool}"
  - id: Database.DropCollection
    kind: operation
    status: r1
    dotnet: "IRustegonDatabase.DropCollectionAsync(string, DropOptions?)"
    java: "RustegonDatabase.dropCollection(String, DropOptions)"
    rpc: [SchemaService.DropCollection]
    result: "{dropped: bool}"
  - id: Database.ListCollectionNames
    kind: operation
    status: r1
    dotnet: "IRustegonDatabase.ListCollectionNamesAsync()"
    java: "RustegonDatabase.listCollectionNames()"
    rpc: [SchemaService.ListCollections]
    result: "[string] sorted by name"
  - id: Database.GetTable
    kind: operation
    status: deferred(M8b)
    dotnet: "IRustegonDatabase.GetTable<TRow>(string)"
    java: "RustegonDatabase.table(String, Class<R>)"
    feature: tables
  - id: Database.GetTimeSeries
    kind: operation
    status: deferred(M8b)
    dotnet: "IRustegonDatabase.GetTimeSeries<T>(string)"
    java: "RustegonDatabase.timeSeries(String, Class<T>)"
    feature: timeseries
  - id: Database.Subscriptions
    kind: operation
    status: deferred(M8a)
    dotnet: "IRustegonDatabase.Subscriptions.OpenWorker<T>(...)"
    java: "RustegonDatabase.subscriptions().worker(...)"
    feature: cdc
