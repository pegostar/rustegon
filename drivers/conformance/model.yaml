    status: r1
    dotnet: "RustegonCredential.X509(X509Certificate2)"
    java: "RustegonCredential.x509(KeyManager)"
    rpc: [AuthService.Authenticate]
    feature: x509-client-cert
  # ------------------------------------------------------------------ database
  - id: Database.GetCollection
