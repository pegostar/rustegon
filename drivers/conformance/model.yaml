  - id: Find.First
    kind: operation
    status: r1
    dotnet: "IFindFluent<T>.FirstOrDefaultAsync()"
    java: "FindIterable<T>.first()"
    rpc: [QueryService.Execute]
    result: "document or null (Optional.empty())"
  - id: Find.Cursor
    kind: operation
    status: r1
    dotnet: "IFindFluent<T>.ToCursorAsync() / ToAsyncEnumerable()"
    java: "FindIterable<T>.cursor()"
    rpc: [QueryService.Execute, QueryService.GetMore, QueryService.KillCursor]
  - id: Collection.UpdateOne
    kind: operation
    status: r1
    dotnet: "IRustegonCollection<T>.UpdateOneAsync(Filter, Update, UpdateOptions?)"
    java: "RustegonCollection<T>.updateOne(Filter, Update, UpdateOptions)"
    rpc: [DocumentService.Update, QueryService.Execute]
    result: "{matchedCount, modifiedCount}"
    notes: "Filter.Id(..) alone -> DocumentService.Update; any other filter -> UPDATE ... LIMIT 1 (PD-070)."
  - id: Collection.UpdateMany
