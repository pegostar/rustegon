    java: "RustegonCollection<T>.replaceOne(Filter, T, ReplaceOptions)"
    rpc: [DocumentService.Replace, DocumentService.Upsert, QueryService.Execute]
    result: "{matchedCount, modifiedCount, upsertedId?}"
    notes: "ReplaceOptions.IsUpsert / upsert(true) needs Filter.Id and uses DocumentService.Upsert."
