---
components:
  headers:
    rgn-causality-token:
      description: Newest causality token of the session; send it back in later requests.
      schema:
        type: string
    rgn-node-id:
      description: Id of the node that served the request.
      schema:
        minimum: 0
        type: integer
    rgn-server-time:
      description: Server wall clock when the response was produced (Unix milliseconds).
      schema:
        minimum: 0
        type: integer
  parameters:
    rgn-causality-token:
      description: "Causality token from an earlier response, for session consistency (at most 4 KiB of visible ASCII)."
      in: header
      name: rgn-causality-token
      required: false
      schema:
        type: string
    rgn-request-id:
      description: Client-generated UUIDv7 that makes retries idempotent (protocol.md §5.1); generated by the server when absent.
      in: header
      name: rgn-request-id
      required: false
      schema:
        type: string
    rgn-txn-id:
      description: Interactive transaction the request runs in (at most 256 visible ASCII bytes).
      in: header
      name: rgn-txn-id
      required: false
      schema:
        type: string
    traceparent:
      description: W3C Trace Context; an invalid value is ignored and a new trace is started.
      in: header
      name: traceparent
      required: false
      schema:
        type: string
    x-rgn-timeout-ms:
      description: Request timeout in milliseconds (1 to 8 decimal digits); becomes the request deadline (protocol.md §5.2). An expired deadline fails with RGN-5006.
      in: header
      name: x-rgn-timeout-ms
      required: false
      schema:
        maximum: 99999999
        minimum: 0
        type: integer
  responses:
    Error:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
      description: "Error (protocol.md §7): the HTTP status follows the error catalog and the body identifies the Rustegon code."
      headers:
        rgn-node-id:
          $ref: "#/components/headers/rgn-node-id"
        rgn-server-time:
          $ref: "#/components/headers/rgn-server-time"
  schemas:
    AlterCollectionRequest:
      additionalProperties: false
      description: "`PATCH …/collections/{coll}` body."
      properties:
        setOptions:
          description: Options to set.
          type: object
        unsetOptions:
          description: Options to remove.
          items:
            type: string
          type: array
      type: object
    ApiKeyJson:
      description: An API key (never its secret).
      properties:
        createdAtUnixMs:
          description: Creation time (Unix ms).
          format: int64
          type: integer
        description:
          description: Description.
          type: string
        expiresAtUnixMs:
          description: Expiry (Unix ms).
          format: int64
          type:
            - integer
            - "null"
        ipAllowlist:
          description: Allowed client networks.
          items:
            type: string
          type: array
        keyId:
          description: Key id.
          type: string
        roles:
          description: Scope.
          items:
            $ref: "#/components/schemas/RoleGrantJson"
          type: array
        user:
          description: Owner.
          type: string
      required:
        - keyId
        - user
        - description
        - roles
        - ipAllowlist
        - createdAtUnixMs
      type: object
    ApiKeyList:
      description: "`GET /api-keys` response."
      properties:
        keys:
          description: Keys.
          items:
            $ref: "#/components/schemas/ApiKeyJson"
          type: array
      required:
        - keys
      type: object
    BackupEncryptionName:
      description: Encryption scope of a backup (PD-064).
      enum:
        - plaintext
        - kek
      type: string
    BackupFileJson:
      description: One file of a backup.
      properties:
        blake3:
          description: BLAKE3 hash (64 lowercase hex digits).
          type: string
        path:
          description: Path relative to the backup directory.
          type: string
        size:
          description: Size in bytes.
          format: int64
          minimum: 0
          type: integer
      required:
        - path
        - size
        - blake3
      type: object
    BackupJson:
      description: Summary of one complete backup.
      properties:
        backupId:
          description: Backup id.
          type: string
        consistency:
          $ref: "#/components/schemas/ConsistencyJson"
          description: Consistency point.
        createdAtUnixMs:
          description: Creation time (Unix ms).
          format: int64
          type: integer
        encryption:
          $ref: "#/components/schemas/BackupEncryptionName"
          description: Encryption scope.
        fileCount:
          description: Number of files.
          format: int64
          minimum: 0
          type: integer
        formatVersion:
          description: Manifest format version.
          format: int32
          minimum: 0
          type: integer
        kekId:
          description: "KEK needed to restore (`kek` encryption only)."
          type:
            - string
            - "null"
        sourceClusterId:
          description: Cluster id of the source.
          type: string
        sourceNodeId:
          description: Node id of the source.
          type: string
        sourceServerVersion:
          description: Version of the server that took the backup.
          type: string
        totalBytes:
          description: Total size of the files (bytes).
          format: int64
          minimum: 0
          type: integer
      required:
        - backupId
        - formatVersion
        - createdAtUnixMs
        - consistency
        - sourceClusterId
        - sourceNodeId
        - sourceServerVersion
        - encryption
        - fileCount
        - totalBytes
      type: object
    BackupList:
      description: "`GET /backups` response."
      properties:
        backups:
          description: "Complete backups, oldest first."
          items:
            $ref: "#/components/schemas/BackupJson"
          type: array
        unreadable:
          description: Complete backups whose manifest cannot be used.
          items:
            $ref: "#/components/schemas/UnreadableBackupJson"
          type: array
      required:
        - backups
        - unreadable
      type: object
    BackupResponse:
      description: "`GET /backups/{backup_id}` response."
      properties:
        backup:
          $ref: "#/components/schemas/BackupJson"
          description: The backup.
        files:
          description: "Its files, sorted by path."
          items:
            $ref: "#/components/schemas/BackupFileJson"
          type: array
      required:
        - backup
        - files
      type: object
    BatchResponse:
      description: One batch of results.
      properties:
        continuationToken:
          description: Sealed keyset token (ordered read queries with more rows; base64url).
          type:
            - string
            - "null"
        cursorId:
          description: "Open cursor to continue with `POST /cursors/{id}/next`."
          type:
            - string
            - "null"
        rows:
          description: "Rows (extended JSON): documents, or any value for `SELECT VALUE` queries."
          items: {}
          type: array
        stats:
          oneOf:
            - $ref: "#/components/schemas/QueryStatsJson"
              description: Statistics (last batch only).
            - type: "null"
        warnings:
          description: Warnings.
          items:
            $ref: "#/components/schemas/WarningJson"
          type: array
      required:
        - rows
        - warnings
      type: object
    BeginRequest:
      additionalProperties: false
      description: "`POST /transactions` body (every field optional: `{}` begins a default transaction)."
      properties:
        consistency:
          oneOf:
            - $ref: "#/components/schemas/Consistency"
              description: "Read consistency (`follower` / `bounded_staleness` only for read-only transactions)."
            - type: "null"
        idleTimeoutMs:
          description: "Idle timeout in milliseconds (can only shorten `txn.liveness_timeout`)."
          format: int32
          minimum: 0
          type:
            - integer
            - "null"
        isolation:
          oneOf:
            - $ref: "#/components/schemas/IsolationName"
              description: Isolation (default serializable).
            - type: "null"
        priority:
          oneOf:
            - $ref: "#/components/schemas/PriorityName"
              description: Priority (default normal).
            - type: "null"
        readOnly:
          description: Read-only transaction.
          type: boolean
        writeConcern:
          oneOf:
            - $ref: "#/components/schemas/WriteConcernName"
              description: Write concern at commit.
            - type: "null"
      type: object
    BeginResponse:
      description: "`POST /transactions` response."
      properties:
        heartbeatIntervalMs:
          description: Send a heartbeat at this interval while idle (milliseconds).
          format: int64
          minimum: 0
          type: integer
        txnId:
          description: "Transaction id (canonical lowercase UUID text); send it as `rgn-txn-id`."
          type: string
      required:
        - txnId
        - heartbeatIntervalMs
      type: object
    BulkOpKind:
      description: Kind of a bulk operation.
      enum:
        - insert
        - replace
        - update
        - upsert
        - delete
      type: string
    BulkOperationJson:
      additionalProperties: false
      description: "One bulk operation: `op` selects which of the other fields are required.\n\nA flat object rather than a tagged enum: serde buffers the fields of internally tagged\nenums, and buffered content cannot hand raw JSON text to the extended-JSON parser."
      properties:
        document:
          description: "Document (`insert`, `replace`, `upsert`)."
          type:
            - object
            - "null"
        id:
          description: "Document id (`replace`, `update`, `delete`; extended-JSON value)."
        ifRev:
          description: "Expected `_rev` (`replace`, `update`, `delete`)."
          type:
            - string
            - "null"
        op:
          $ref: "#/components/schemas/BulkOpKind"
          description: Operation.
        operations:
          description: "Update operators (`update`; structured-AST form)."
          items:
            type: object
          type:
            - array
            - "null"
      required:
        - op
      type: object
    BulkWriteErrorJson:
      description: A failed bulk operation.
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
          description: "The error (code, name, retryable, details, trace id)."
        index:
          description: Index of the operation in the request.
          format: int32
          minimum: 0
          type: integer
      required:
        - index
        - error
      type: object
    BulkWriteRequest:
      additionalProperties: false
      description: "`POST …/bulk` body."
      properties:
        operations:
          description: Operations (≤ 100 000).
          items:
            $ref: "#/components/schemas/BulkOperationJson"
          type: array
        options:
          $ref: "#/components/schemas/WriteOptionsJson"
          description: Options.
        ordered:
          description: Stop at the first failure.
          type: boolean
        params:
          description: Parameters of the update operators.
          type: object
      required:
        - operations
      type: object
    BulkWriteResponse:
      description: "`POST …/bulk` response."
      properties:
        deleted:
          description: Deleted.
          format: int64
          minimum: 0
          type: integer
        errors:
          description: Failed operations.
          items:
            $ref: "#/components/schemas/BulkWriteErrorJson"
          type: array
        inserted:
          description: Inserted (inserts and inserting upserts).
          format: int64
          minimum: 0
          type: integer
        matched:
          description: Matched by replace/update/upsert.
          format: int64
          minimum: 0
          type: integer
        modified:
          description: Changed by replace/update/upsert.
          format: int64
          minimum: 0
          type: integer
        warnings:
          description: Warnings.
          items:
            $ref: "#/components/schemas/WarningJson"
          type: array
      required:
        - inserted
        - matched
        - modified
        - deleted
        - errors
        - warnings
      type: object
    ChangePasswordRequest:
      additionalProperties: false
      description: "`POST /auth/password` body."
      properties:
        currentPassword:
          description: Current password (a wrong one is RGN-4001 and counts towards lockout).
          type: string
        newPassword:
          description: New password (checked against the password policy).
          type: string
      required:
        - currentPassword
        - newPassword
      type: object
    ClientInfoJson:
      additionalProperties: false
      description: Client identification stored with the session.
      properties:
        application:
          description: Application name.
          type: string
        driverName:
          description: Driver or tool name.
          type: string
        driverVersion:
          description: Driver version.
          type: string
      type: object
    CollectionJson:
      description: A collection.
      properties:
        name:
          description: Name.
          type: string
        options:
          description: Options as extended-JSON values.
          type: object
        validator:
          oneOf:
            - $ref: "#/components/schemas/ValidatorJson"
              description: Validator.
            - type: "null"
      required:
        - name
        - options
      type: object
    CollectionList:
      description: "`GET …/collections` response."
      properties:
        collections:
          description: Collections the caller holds any privilege on.
          items:
            $ref: "#/components/schemas/CollectionJson"
          type: array
      required:
        - collections
      type: object
    Consistency:
      additionalProperties: false
      description: Read consistency of a read outside transactions.
      properties:
        level:
          $ref: "#/components/schemas/ConsistencyLevel"
          description: Level.
        maxStalenessMs:
          description: Staleness bound in milliseconds.
          format: int32
          minimum: 0
          type:
            - integer
            - "null"
      required:
        - level
      type: object
    ConsistencyJson:
      description: The consistency point of a backup or snapshot (PD-063).
      properties:
        appliedIndex:
          description: Last applied Raft log index in the image.
          format: int64
          minimum: 0
          type: integer
        appliedTerm:
          description: "Term of `appliedIndex`."
          format: int64
          minimum: 0
          type: integer
        storageSeqno:
          description: Every storage write with a sequence number up to this one is in the image.
          format: int64
          minimum: 0
          type: integer
        timestamp:
          $ref: "#/components/schemas/HlcJson"
          description: Consistency timestamp T.
      required:
        - timestamp
        - appliedIndex
        - appliedTerm
        - storageSeqno
      type: object
    ConsistencyLevel:
      description: "Read consistency level (protocol.md §3 `ReadConsistencyLevel`; omitted = server default)."
      enum:
        - linearizable
        - bounded_staleness
        - follower
      type: string
    CreateApiKeyRequest:
      additionalProperties: false
      description: "`POST /api-keys` body."
      properties:
        description:
          description: Description.
          type: string
        expiresAtUnixMs:
          description: Expiry (Unix ms).
          format: int64
          type:
            - integer
            - "null"
        ipAllowlist:
          description: Allowed client IPs/CIDRs.
          items:
            type: string
          type: array
        roles:
          description: "Scope (intersected with the owner's roles)."
          items:
            $ref: "#/components/schemas/RoleGrantJson"
          type: array
        user:
          description: "Owner (default: the caller)."
          type:
            - string
            - "null"
      type: object
    CreateApiKeyResponse:
      description: "`POST /api-keys` response: the only time the secret is shown."
      properties:
        key:
          $ref: "#/components/schemas/ApiKeyJson"
          description: The key.
        secret:
          description: "The full key (`rgn_<key_id>_<secret>`) for `Authorization: ApiKey …`."
          type: string
      required:
        - key
        - secret
      type: object
    CreateBackupRequest:
      additionalProperties: false
      description: "`POST /backups` body."
      properties:
        destination:
          description: "Destination: absolute path on the server, `file://…` or `s3://…` URL."
          type: string
      required:
        - destination
      type: object
    CreateBackupResponse:
      description: "`POST /backups` response."
      properties:
        backup:
          $ref: "#/components/schemas/BackupJson"
          description: The written backup.
        warnings:
          description: Non-fatal conditions.
          items:
            $ref: "#/components/schemas/WarningJson"
          type: array
      required:
        - backup
        - warnings
      type: object
    CreateCollectionRequest:
      additionalProperties: false
      description: "`POST …/collections` body."
      properties:
        ifNotExists:
          description: "Succeed with `created = false` when it exists."
          type: boolean
        name:
          description: Name.
          type: string
        options:
          description: Options.
          type: object
        validator:
          oneOf:
            - $ref: "#/components/schemas/ValidatorJson"
              description: Validator.
            - type: "null"
      required:
        - name
      type: object
    CreateDatabaseRequest:
      additionalProperties: false
      description: "`POST /databases` body."
      properties:
        ifNotExists:
          description: "Succeed with `created = false` when it exists."
          type: boolean
        name:
          description: Name.
          type: string
        options:
          description: Options as extended-JSON values.
          type: object
      required:
        - name
      type: object
    CreateIndexRequest:
      additionalProperties: false
      description: "`POST …/indexes` body."
      properties:
        definition:
          description: "`CREATE INDEX` in the structured-AST JSON form; it must name the collection of the\npath (and, when it names one, the database)."
          type: object
        ifNotExists:
          description: Succeed when an index of that name and definition exists.
          type: boolean
      required:
        - definition
      type: object
    CreateSnapshotRequest:
      additionalProperties: false
      description: "`POST /snapshots` body."
      properties:
        name:
          description: "Name: 1 to 64 characters `[A-Za-z0-9._-]`, not starting with `.`."
          type: string
      required:
        - name
      type: object
    CreateUserRequest:
      additionalProperties: false
      description: "`POST /users` body."
      properties:
        mustChangePassword:
          description: Force a password change at first login.
          type: boolean
        name:
          description: "Name (`x509:<subject>` for certificate users)."
          type: string
        password:
          description: Initial password (password users).
          type:
            - string
            - "null"
        roles:
          description: Granted roles.
          items:
            $ref: "#/components/schemas/RoleGrantJson"
          type: array
        x509Subject:
          description: "X.509 subject (must equal the name after `x509:`)."
          type:
            - string
            - "null"
      required:
        - name
      type: object
    CreatedResponse:
      description: Outcome of a create.
      properties:
        created:
          description: "`false` when `ifNotExists` found the object."
          type: boolean
      required:
        - created
      type: object
    DatabaseJson:
      description: A database.
      properties:
        name:
          description: Name.
          type: string
        options:
          description: "Options (`implicit_collection_creation`) as extended-JSON values."
          type: object
      required:
        - name
        - options
      type: object
    DatabaseList:
      description: "`GET /databases` response."
      properties:
        databases:
          description: Databases the caller holds any privilege on.
          items:
            $ref: "#/components/schemas/DatabaseJson"
          type: array
      required:
        - databases
      type: object
    DeleteResponse:
      description: "`DELETE …/documents/{id}` response."
      properties:
        deleted:
          description: A document was deleted.
          type: boolean
        document:
          description: "The deleted document, if requested."
          type:
            - object
            - "null"
      required:
        - deleted
      type: object
    DeleteSnapshotResponse:
      description: "`DELETE /snapshots/{name}` response."
      properties:
        deleted:
          description: False when no snapshot of that name existed.
          type: boolean
      required:
        - deleted
      type: object
    Delivery:
      description: How the session reaches the client (module docs).
      enum:
        - cookie
        - token
      type: string
    DocumentPage:
      description: One page of documents.
      properties:
        continuationToken:
          description: Token for the next page; absent on the last page.
          type:
            - string
            - "null"
        documents:
          description: Documents (extended JSON) in sort order.
          items:
            type: object
          type: array
        warnings:
          description: Warnings.
          items:
            $ref: "#/components/schemas/WarningJson"
          type: array
      required:
        - documents
        - warnings
      type: object
    DocumentResponse:
      description: A document.
      properties:
        document:
          description: The document (extended JSON).
          type: object
      required:
        - document
      type: object
    DroppedResponse:
      description: Outcome of a drop.
      properties:
        dropped:
          description: "`false` when `ifExists` found nothing."
          type: boolean
      required:
        - dropped
      type: object
    Empty:
      description: Empty success body of commit and rollback.
      type: object
    EmptyResponse:
      description: Empty success body.
      type: object
    ErrorBody:
      description: The JSON error body of every failed REST request.
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
          description: The error.
      required:
        - error
      type: object
    ErrorInfo:
      description: "Error fields (`ErrorDetail` of protocol.md §3 plus the message)."
      properties:
        code:
          description: "Numeric Rustegon code (`RGN-<code>`, protocol.md §7)."
          example: 1001
          format: int32
          minimum: 0
          type: integer
        committed:
          description: "Present (`true`) only when the operation is known to have committed despite the error\n(`WriteConcernTimeout`); absent means \"not known to have committed\"."
          type:
            - boolean
            - "null"
        details:
          additionalProperties:
            type: string
          description: "Structured details (for example `header` for a malformed request header)."
          propertyNames:
            type: string
          type: object
        message:
          description: Human-readable message; never contains document contents or secrets.
          type: string
        name:
          description: Stable code name.
          example: InvalidArgument
          type: string
        retryable:
          description: Whether the client may retry the request.
          type: boolean
        traceId:
          description: W3C trace id (32 lowercase hex digits) to correlate with server logs.
          example: 4bf92f3577b34da6a3ce929d0e0e4736
          type: string
      required:
        - code
        - name
        - message
        - retryable
        - details
        - traceId
      type: object
    ExecOptionsJson:
      additionalProperties: false
      description: "Execution options (`ExecOptions` of protocol.md §3 without `maxBatches`, which REST fixes\nat 1)."
      properties:
        allowDiskUse:
          description: Allow blocking stages to spill (accepted; no effect in M4).
          type: boolean
        batchSize:
          description: Preferred rows per batch.
          format: int32
          minimum: 0
          type:
            - integer
            - "null"
        consistency:
          oneOf:
            - $ref: "#/components/schemas/Consistency"
              description: Read consistency outside transactions.
            - type: "null"
        continuationToken:
          description: Continuation token of a previous batch (base64url).
          type:
            - string
            - "null"
        maxTimeMs:
          description: Server-side time limit covering every batch of the cursor (milliseconds).
          format: int64
          minimum: 0
          type:
            - integer
            - "null"
        writeConcern:
          oneOf:
            - $ref: "#/components/schemas/WriteConcernName"
              description: Write concern of data-modifying statements outside transactions.
            - type: "null"
      type: object
    ExplainResponse:
      description: "`POST /databases/{db}/explain` response."
      properties:
        plan:
          description: The plan in explain format 1 (query-language.md §5.1).
          type: object
      required:
        - plan
      type: object
    GetManyRequest:
      additionalProperties: false
      description: "`POST …/get-many` body."
      properties:
        consistency:
          oneOf:
            - $ref: "#/components/schemas/Consistency"
              description: Read consistency.
            - type: "null"
        ids:
          description: Ids (extended-JSON values).
          items: {}
          type: array
      required:
        - ids
      type: object
    GetManyResponse:
      description: "`POST …/get-many` response: the documents found, in request order."
      properties:
        documents:
          description: Documents (missing ids are omitted).
          items:
            type: object
          type: array
      required:
        - documents
      type: object
    HeartbeatResponse:
      description: "`POST /transactions/{id}/heartbeat` response."
      properties:
        expiresInMs:
          description: Time until the transaction expires without another call (milliseconds).
          format: int64
          minimum: 0
          type: integer
      required:
        - expiresInMs
      type: object
    HlcJson:
      description: An HLC timestamp.
      properties:
        logical:
          description: Logical component.
          format: int32
          minimum: 0
          type: integer
        wallNs:
          description: "Physical component: nanoseconds since the Unix epoch, as a decimal string."
          type: string
      required:
        - wallNs
        - logical
      type: object
    IndexJson:
      description: An index.
      properties:
        definition:
          description: "Definition: `CREATE INDEX` in the structured-AST JSON form."
          type: object
        error:
          description: Failure message when failed.
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/IndexStateName"
          description: State.
      required:
        - definition
        - state
      type: object
    IndexList:
      description: "`GET …/indexes` response."
      properties:
        indexes:
          description: Indexes of the collection.
          items:
            $ref: "#/components/schemas/IndexJson"
          type: array
      required:
        - indexes
      type: object
    IndexProgressResponse:
      description: "`GET …/indexes/{name}/progress` response."
      properties:
        docsProcessed:
          description: "Documents processed by this node's build task."
          format: int64
          minimum: 0
          type: integer
        docsTotal:
          description: "Estimated total (0: not estimated)."
          format: int64
          minimum: 0
          type: integer
        state:
          $ref: "#/components/schemas/IndexStateName"
          description: State.
      required:
        - state
        - docsProcessed
        - docsTotal
      type: object
    IndexResponse:
      description: "`POST …/indexes` response."
      properties:
        index:
          $ref: "#/components/schemas/IndexJson"
          description: "The index (state `building` until the online build completes)."
      required:
        - index
      type: object
    IndexStateName:
      description: Index state.
      enum:
        - building
        - ready
        - failed
        - hidden
      type: string
    InsertRequest:
      additionalProperties: false
      description: "`POST …/documents` body."
      properties:
        documents:
          description: "Documents to insert atomically (extended JSON; `_id` generated when absent)."
          items:
            type: object
          type: array
        options:
          $ref: "#/components/schemas/WriteOptionsJson"
          description: Options.
      required:
        - documents
      type: object
    InsertResponse:
      description: "`POST …/documents` response."
      properties:
        results:
          description: "One result per document, in request order."
          items:
            $ref: "#/components/schemas/WriteResultJson"
          type: array
        warnings:
          description: Warnings.
          items:
            $ref: "#/components/schemas/WarningJson"
          type: array
      required:
        - results
        - warnings
      type: object
    IsolationName:
      description: Transaction isolation level.
      enum:
        - serializable
        - snapshot
        - read_committed
      type: string
    KillCursorResponse:
      description: "`DELETE /cursors/{id}` response."
      properties:
        killed:
          description: "`false` if the cursor was unknown or already closed."
          type: boolean
      required:
        - killed
      type: object
    LiveResponse:
      description: "`GET /api/v1/health/live` response."
      properties:
        status:
          description: "Always `live`."
          example: live
          type: string
      required:
        - status
      type: object
    LoginRequest:
      additionalProperties: false
      description: "`POST /auth/login` body (plain password over TLS; module docs)."
      properties:
        clientInfo:
          oneOf:
            - $ref: "#/components/schemas/ClientInfoJson"
              description: Client identification.
            - type: "null"
        delivery:
          $ref: "#/components/schemas/Delivery"
          description: Session delivery.
        password:
          description: Password (never logged).
          type: string
        user:
          description: User name.
          type: string
      required:
        - user
        - password
      type: object
    LoginResponse:
      description: A completed login.
      properties:
        csrfToken:
          description: "CSRF token to send as `X-RGN-CSRF` (cookie delivery)."
          type:
            - string
            - "null"
        expiresAtUnixMs:
          description: Absolute session expiry (Unix ms).
          format: int64
          type: integer
        mustChangePassword:
          description: "The user must change its password (`POST /auth/password`) before anything else."
          type: boolean
        serverFinal:
          description: "SASL server-final message to verify (`scram/finish` only)."
          type:
            - string
            - "null"
        sessionToken:
          description: "Session token for `Authorization: Bearer` (token delivery)."
          type:
            - string
            - "null"
        user:
          description: Authenticated user.
          type: string
      required:
        - user
        - expiresAtUnixMs
        - mustChangePassword
      type: object
    MeResponse:
      description: "`GET /auth/me` response (`AuthService.WhoAmI`)."
      properties:
        apiKeyId:
          description: API key id for API key callers.
          type:
            - string
            - "null"
        expiresAtUnixMs:
          description: Session or API key expiry (Unix ms; 0 = none).
          format: int64
          type: integer
        mechanism:
          $ref: "#/components/schemas/MechanismName"
          description: How the caller authenticated.
        roles:
          description: Roles in effect.
          items:
            $ref: "#/components/schemas/RoleGrantJson"
          type: array
        user:
          description: User name.
          type: string
      required:
        - user
        - roles
        - mechanism
        - expiresAtUnixMs
      type: object
    MechanismName:
      description: How the caller authenticated.
      enum:
        - unspecified
        - scram
        - x509
        - api_key
      type: string
    PingResponse:
      description: "`GET /api/v1/ping` response (empty object, like gRPC `PingResponse`)."
      type: object
    PriorityName:
      description: Transaction priority.
      enum:
        - high
        - normal
        - low
      type: string
    PrivilegeJson:
      additionalProperties: false
      description: A privilege of a custom role.
      properties:
        actions:
          description: Action names.
          items:
            type: string
          type: array
        resource:
          description: "Resource pattern (`cluster`, `database:<db>`, `collection:<db>.<coll>`, …)."
          type: string
      required:
        - resource
        - actions
      type: object
    QueryRequest:
      additionalProperties: false
      description: "`POST /databases/{db}/query` and `…/explain` body."
      properties:
        analyze:
          description: "`explain` only: `EXPLAIN ANALYZE` (executes; writes are rolled back)."
          type: boolean
        ast:
          description: Structured statement in the JSON form of query-language.md §13.
          type:
            - object
            - "null"
        options:
          $ref: "#/components/schemas/ExecOptionsJson"
          description: Options.
        params:
          description: "Parameters (`$name`, `$1`, …) as extended-JSON values."
          type: object
        rgql:
          description: "RGQL text (exactly one of `rgql` and `ast`)."
          type:
            - string
            - "null"
        txnId:
          description: "Interactive transaction (the `rgn-txn-id` header also applies)."
          type:
            - string
            - "null"
      type: object
    QueryStatsJson:
      description: Execution statistics (last batch only).
      properties:
        docsAffected:
          description: "Documents inserted, updated or deleted."
          format: int64
          minimum: 0
          type: integer
        docsReturned:
          description: Rows returned by the whole result.
          format: int64
          minimum: 0
          type: integer
        executionTimeUs:
          description: Server time from the start of the query to this batch (µs).
          format: int64
          minimum: 0
          type: integer
      required:
        - docsReturned
        - docsAffected
        - executionTimeUs
      type: object
    ReadyResponse:
      description: "`GET /api/v1/health/ready` response."
      properties:
        status:
          description: "`ready` (200), or why not (503): `starting`, `draining`, `unhealthy`."
          example: ready
          type: string
      required:
        - status
      type: object
    RemovedResponse:
      description: "`DELETE …/validator` response."
      properties:
        removed:
          description: "`false` when the collection had no validator."
          type: boolean
      required:
        - removed
      type: object
    ReturnDocumentName:
      description: Which version of a written document the response carries.
      enum:
        - none
        - before
        - after
      type: string
    RoleGrantJson:
      additionalProperties: false
      description: "A role granted on a resource (protocol.md §8: `{r, \"database:db\"}` = `r@db`,\n`{r, \"collection:db.c\"}` = `r@db.c`, `{r, \"\" | \"cluster\" | \"database:*\"}` = `r`)."
      properties:
        resource:
          description: "`cluster`, `database:<db>`, `database:*`, `collection:<db>.<coll>` or empty."
          type: string
        role:
          description: Role name.
          type: string
      required:
        - role
      type: object
    RoleJson:
      additionalProperties: false
      description: A role.
      properties:
        builtIn:
          description: Built-in roles cannot be changed or dropped (ignored in requests).
          type: boolean
        inherits:
          description: Inherited role references.
          items:
            type: string
          type: array
        name:
          description: Name.
          type: string
        privileges:
          description: Privileges.
          items:
            $ref: "#/components/schemas/PrivilegeJson"
          type: array
      required:
        - name
      type: object
    RoleList:
      description: "`GET /roles` response."
      properties:
        roles:
          description: Built-in and custom roles.
          items:
            $ref: "#/components/schemas/RoleJson"
          type: array
      required:
        - roles
      type: object
    RoleResponse:
      description: "`{role}` response."
      properties:
        role:
          $ref: "#/components/schemas/RoleJson"
          description: The role.
      required:
        - role
      type: object
    ScramFinishRequest:
      additionalProperties: false
      description: "`POST /auth/scram/finish` body."
      properties:
        clientFinal:
          description: SASL client-final message.
          type: string
        handshakeId:
          description: Id from the start call.
          type: string
      required:
        - handshakeId
        - clientFinal
      type: object
    ScramStartRequest:
      additionalProperties: false
      description: "`POST /auth/scram/start` body."
      properties:
        clientFirst:
          description: "SASL client-first message (`n,,n=<user>,r=<nonce>`; `p=tls-exporter` selects\nSCRAM-SHA-256-PLUS, which requires both calls on the same TLS 1.3 connection)."
          type: string
        clientInfo:
          oneOf:
            - $ref: "#/components/schemas/ClientInfoJson"
              description: Client identification.
            - type: "null"
        delivery:
          $ref: "#/components/schemas/Delivery"
          description: Session delivery.
      required:
        - clientFirst
      type: object
    ScramStartResponse:
      description: "`POST /auth/scram/start` response."
      properties:
        handshakeId:
          description: "Id to send with the client-final message (valid 30 s, once)."
          type: string
        serverFirst:
          description: SASL server-first message.
          type: string
      required:
        - handshakeId
        - serverFirst
      type: object
    ServerInfoResponse:
      description: "`GET /api/v1/server-info` response (gRPC `GetServerInfoResponse`)."
      properties:
        features:
          description: Capability flags of this node (protocol.md §9).
          items:
            type: string
          type: array
        nodeAddresses:
          description: "Client endpoints (`host:port`) of the cluster nodes known to this node."
          items:
            type: string
          type: array
        protocolVersion:
          description: "Protocol version `1.<minor>` (protocol.md §9)."
          example: "1.0"
          type: string
        serverVersion:
          description: Server version (semver of the release).
          example: 0.1.0
          type: string
      required:
        - serverVersion
        - protocolVersion
        - features
        - nodeAddresses
      type: object
    SettingJson:
      description: A runtime setting.
      properties:
        defaultValue:
          description: Default value as TOML text.
          type: string
        description:
          description: Description.
          type: string
        name:
          description: "Name (`section.key`)."
          type: string
        runtimeMutable:
          description: Changeable at runtime.
          type: boolean
        value:
          description: Current value as TOML text (secrets redacted).
          type: string
      required:
        - name
        - value
        - defaultValue
        - runtimeMutable
        - description
      type: object
    SettingList:
      description: Settings response.
      properties:
        settings:
          description: Settings.
          items:
            $ref: "#/components/schemas/SettingJson"
          type: array
      required:
        - settings
      type: object
    SnapshotJson:
      description: A local snapshot.
      properties:
        consistency:
          $ref: "#/components/schemas/ConsistencyJson"
          description: Consistency point.
        createdAtUnixMs:
          description: Creation time (Unix ms).
          format: int64
          type: integer
        fileCount:
          description: Number of files.
          format: int64
          minimum: 0
          type: integer
        name:
          description: Name.
          type: string
        totalBytes:
          description: "Total size of the files (bytes, shared with the store through hard links)."
          format: int64
          minimum: 0
          type: integer
      required:
        - name
        - createdAtUnixMs
        - consistency
        - fileCount
        - totalBytes
      type: object
    SnapshotList:
      description: "`GET /snapshots` response."
      properties:
        snapshots:
          description: Snapshots by name.
          items:
            $ref: "#/components/schemas/SnapshotJson"
          type: array
      required:
        - snapshots
      type: object
    SnapshotResponse:
      description: "`{snapshot}` response."
      properties:
        snapshot:
          $ref: "#/components/schemas/SnapshotJson"
          description: The snapshot.
      required:
        - snapshot
      type: object
    StatusResponse:
      description: "`GET /transactions/{id}` response."
      properties:
        abortReason:
          description: "RGN-2002 reason when aborted (`rollback`, `conflict`, `timeout_pushed`, `killed`, …)."
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/TransactionState"
          description: State.
      required:
        - state
      type: object
    TransactionState:
      description: Transaction state.
      enum:
        - active
        - committing
        - committed
        - aborted
      type: string
    UnreadableBackupJson:
      description: A complete backup whose manifest cannot be used.
      properties:
        backupId:
          description: Backup id.
          type: string
        error:
          $ref: "#/components/schemas/ErrorInfo"
          description: Why (the error body of protocol.md §7).
      required:
        - backupId
        - error
      type: object
    UpdateRequest:
      additionalProperties: false
      description: "`PATCH …/documents/{id}` body."
      properties:
        operations:
          description: "Update operators: a JSON array in the structured-AST form of query-language.md §13\n(the `ops` of an `UPDATE` statement)."
          items:
            type: object
          type: array
        params:
          description: "Statement parameters (`$name`, `$1`, …) as extended-JSON values."
          type: object
      required:
        - operations
      type: object
    UpdateRoleRequest:
      additionalProperties: false
      description: "`PATCH /roles/{name}` body: the new privileges and inheritance (both replaced)."
      properties:
        inherits:
          description: Inherited role references.
          items:
            type: string
          type: array
        privileges:
          description: Privileges.
          items:
            $ref: "#/components/schemas/PrivilegeJson"
          type: array
      type: object
    UpdateSettingsRequest:
      additionalProperties: false
      description: "`PATCH /settings` body."
      properties:
        values:
          additionalProperties:
            type: string
          description: "Setting name → new value as TOML text, applied atomically."
          propertyNames:
            type: string
          type: object
      required:
        - values
      type: object
    UpdateUserRequest:
      additionalProperties: false
      description: "`PATCH /users/{name}` body; absent fields are unchanged."
      properties:
        disabled:
          description: Disable or enable.
          type:
            - boolean
            - "null"
        mustChangePassword:
          description: Force or clear a password change.
          type:
            - boolean
            - "null"
        password:
          description: "New password (revokes the user's sessions)."
          type:
            - string
            - "null"
        roles:
          description: "New role grants, replacing the old ones (revokes sessions)."
          items:
            $ref: "#/components/schemas/RoleGrantJson"
          type:
            - array
            - "null"
        x509Subject:
          description: "X.509 subject (cannot change: it is the name)."
          type:
            - string
            - "null"
      type: object
    UserJson:
      description: A user (never its credentials).
      properties:
        createdAtUnixMs:
          description: Creation time (Unix ms).
          format: int64
          type: integer
        disabled:
          description: Disabled users cannot authenticate.
          type: boolean
        mustChangePassword:
          description: The password must be changed at next login.
          type: boolean
        name:
          description: Name.
          type: string
        roles:
          description: Granted roles.
          items:
            $ref: "#/components/schemas/RoleGrantJson"
          type: array
        x509Subject:
          description: "X.509 subject of `x509:` users."
          type:
            - string
            - "null"
      required:
        - name
        - roles
        - disabled
        - mustChangePassword
        - createdAtUnixMs
      type: object
    UserList:
      description: "`GET /users` response."
      properties:
        users:
          description: Users.
          items:
            $ref: "#/components/schemas/UserJson"
          type: array
      required:
        - users
      type: object
    UserResponse:
      description: "`{user}` response."
      properties:
        user:
          $ref: "#/components/schemas/UserJson"
          description: The user.
      required:
        - user
      type: object
    ValidationActionName:
      description: Validation action.
      enum:
        - error
        - warn
      type: string
    ValidationLevelName:
      description: Validation level.
      enum:
        - "off"
        - strict
        - moderate
      type: string
    ValidatorJson:
      additionalProperties: false
      description: A collection validator (data-model.md §5).
      properties:
        action:
          oneOf:
            - $ref: "#/components/schemas/ValidationActionName"
              description: Action (default error).
            - type: "null"
        definition:
          description: "`{\"$jsonSchema\": …}`, stored verbatim."
          type: object
        level:
          oneOf:
            - $ref: "#/components/schemas/ValidationLevelName"
              description: Level (default strict).
            - type: "null"
      required:
        - definition
      type: object
    ValidatorResponse:
      description: "`GET …/validator` response."
      properties:
        validator:
          oneOf:
            - $ref: "#/components/schemas/ValidatorJson"
              description: "The validator, absent when the collection has none."
            - type: "null"
      type: object
    VerifyBackupRequest:
      additionalProperties: false
      description: "`POST /backups/{backup_id}/verify` body."
      properties:
        deep:
          description: Also read every file and compare its BLAKE3 hash.
          type: boolean
        destination:
          description: Destination of the backup.
          type: string
      required:
        - destination
      type: object
    VerifyBackupResponse:
      description: "`POST /backups/{backup_id}/verify` response."
      properties:
        backup:
          $ref: "#/components/schemas/BackupJson"
          description: The verified backup.
        bytesHashed:
          description: Bytes read and hashed (0 for a shallow verification).
          format: int64
          minimum: 0
          type: integer
        filesChecked:
          description: Files checked.
          format: int64
          minimum: 0
          type: integer
      required:
        - backup
        - filesChecked
        - bytesHashed
      type: object
    WarningJson:
      description: A non-fatal condition reported with a result.
      properties:
        details:
          additionalProperties:
            type: string
          description: Details.
          propertyNames:
            type: string
          type: object
        kind:
          description: "Stable kind, e.g. `EvaluationWarning`."
          type: string
        message:
          description: Message (no document contents).
          type: string
      required:
        - kind
        - message
        - details
      type: object
    WriteConcernName:
      description: "Write concern (protocol.md §3 `WriteConcern`; omitted = server default, majority)."
      enum:
        - majority
        - all
        - local_dc_majority
        - sync_cross_dc
        - async_cross_dc
      type: string
    WriteOptionsJson:
      additionalProperties: false
      description: Write options in a body.
      properties:
        writeConcern:
          oneOf:
            - $ref: "#/components/schemas/WriteConcernName"
              description: Write concern (default majority).
            - type: "null"
      type: object
    WriteResponse:
      description: "`PUT`/`PATCH …/documents/{id}` response."
      properties:
        document:
          description: "The requested image (`returnDocument`)."
          type:
            - object
            - "null"
        inserted:
          description: "The document was inserted (`PUT ?upsert=true`)."
          type: boolean
        matched:
          description: A document with the id existed.
          type: boolean
        modified:
          description: "The document changed (`PATCH`)."
          type: boolean
        result:
          oneOf:
            - $ref: "#/components/schemas/WriteResultJson"
              description: Write result when something was written.
            - type: "null"
        warnings:
          description: Warnings.
          items:
            $ref: "#/components/schemas/WarningJson"
          type: array
      required:
        - matched
        - modified
        - inserted
        - warnings
      type: object
    WriteResultJson:
      description: Outcome of one written document.
      properties:
        id:
          description: Document id (extended-JSON value).
        rev:
          description: "New `_rev` (absent for deletes)."
          type:
            - string
            - "null"
      required:
        - id
      type: object
  securitySchemes:
    apiKey:
      description: "API key for automation: `Authorization: ApiKey rgn_<key_id>_<secret>`."
      in: header
      name: Authorization
      type: apiKey
    bearer:
      description: "Session token from the login endpoints: `Authorization: Bearer <token>`."
      scheme: bearer
      type: http
    sessionCookie:
      description: "GUI session cookie. State-changing requests authenticated by it must send the `x-rgn-csrf` header with the CSRF token of the session."
      in: cookie
      name: rgn_session
      type: apiKey
info:
  description: "REST/JSON front end of Rustegon (protocol.md §4). Every operation calls the same service layer as the gRPC API (`rustegon.v1`), so behaviour and errors are identical on both channels. Errors use the body `{\"error\": {code, name, message, retryable, committed?, details, traceId}}` with the HTTP status of protocol.md §7."
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: Rustegon REST API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      parameters:
        - description: "Only the keys of this user (default: the caller's own; another user's need\n`user_manage`)."
          in: query
          name: user
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/rgn-request-id"
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/x-rgn-timeout-ms"
        - $ref: "#/components/parameters/rgn-txn-id"
        - $ref: "#/components/parameters/rgn-causality-token"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
          description: Keys (never their secrets).
          headers:
            rgn-causality-token:
              $ref: "#/components/headers/rgn-causality-token"
            rgn-node-id:
              $ref: "#/components/headers/rgn-node-id"
            rgn-server-time:
              $ref: "#/components/headers/rgn-server-time"
        default:
          $ref: "#/components/responses/Error"
      security:
        - bearer: []
        - apiKey: []
        - sessionCookie: []
      summary: "API keys (`AdminService.ListApiKeys`; own keys, or `user_manage`)."
      tags:
        - admin
    post:
      operationId: createApiKey
      parameters:
        - $ref: "#/components/parameters/rgn-request-id"
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/x-rgn-timeout-ms"
        - $ref: "#/components/parameters/rgn-txn-id"
        - $ref: "#/components/parameters/rgn-causality-token"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyResponse"
          description: The key and its secret.
          headers:
            rgn-causality-token:
              $ref: "#/components/headers/rgn-causality-token"
            rgn-node-id:
              $ref: "#/components/headers/rgn-node-id"
            rgn-server-time:
              $ref: "#/components/headers/rgn-server-time"
        default:
          $ref: "#/components/responses/Error"
      security:
        - bearer: []
        - apiKey: []
        - sessionCookie: []
      summary: "Creates an API key; the secret is returned once (`AdminService.CreateApiKey`)."
      tags:
        - admin
  "/api/v1/api-keys/{key_id}":
    delete:
      operationId: revokeApiKey
      parameters:
        - description: Key id.
          in: path
          name: key_id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/rgn-request-id"
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/x-rgn-timeout-ms"
        - $ref: "#/components/parameters/rgn-txn-id"
        - $ref: "#/components/parameters/rgn-causality-token"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
          description: Revoked.
          headers:
            rgn-causality-token:
