          description: The node serves traffic.
          headers:
            rgn-node-id:
              $ref: "#/components/headers/rgn-node-id"
            rgn-server-time:
              $ref: "#/components/headers/rgn-server-time"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
          description: "The node should not receive traffic (starting, draining, store unhealthy)."
          headers:
            rgn-node-id:
